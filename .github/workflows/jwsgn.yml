name: Deploy JWSGN

on:
  push:
    branches:
      - main
      - master
    paths:
      - "janhitcampus/janhit_world_school_gn/**"
      - "package.json"
      - "package-lock.json"

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clean Install
        run: |
          rm -rf node_modules
          rm -rf janhitcampus/janhit_world_school_gn/node_modules
          rm -f package-lock.json

          npm install

      - name: Verify Rollup
        run: |
          npm ls rollup

      - name: Build JWSGN
        run: |
          npm run build:jwsgn

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3
        run: |
          aws s3 sync \
          janhitcampus/janhit_world_school_gn/dist \
          s3://jwsgn.janhitgroup.com \
          --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
          --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
          --paths "/*"
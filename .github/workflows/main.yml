name: Janhit Group Main CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'janhitmaingroup/janhit_group_main/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'janhitmaingroup/janhit_group_main/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build --workspace=janhit_group_main

      - name: Lint project
        run: npm run lint --workspace=janhit_group_main

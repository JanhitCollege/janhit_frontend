name: Deploy JCLGN

on:
  push:
    branches:
      - main
    paths:
      - "janhitcampus/janhitcollege_law/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/jclgn.yml"

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm install

      - name: Build JCLGN
        run: npm run build:law

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Deploy to S3
        run: |
          aws s3 sync ./janhitcampus/janhitcollege_law/dist s3://jclgn.janhitgroup.com --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id EWPBU8LUAFG3B \
            --paths "/*"